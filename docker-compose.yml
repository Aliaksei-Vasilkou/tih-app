
services:
  postgres:
    image: postgres:16-alpine
    container_name: tih-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tih_db
      POSTGRES_USER: tih_user
      POSTGRES_PASSWORD: tih_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tih_user -d tih_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  tih-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tih-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tih_db
      DB_USER: tih_user
      DB_PASSWORD: tih_password
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    driver: local
